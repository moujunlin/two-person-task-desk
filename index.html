<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self' https://*.supabase.co; object-src 'none'; base-uri 'none'; form-action 'none'"><title>一起做点什么 · 任务台</title><link rel="stylesheet" href="style.css"></head><body><main><header><p class="eyebrow">两个人的小工作区</p><h1>一起做点什么</h1><p>把想法写下来，一起讨论，再一步步完成。</p></header><p id="notice" role="status" aria-live="polite">正在检查配置…</p><section id="login"><h2>登录工作区</h2><p>仅限已获邀请的两个账号。此页面不提供注册。</p><form id="login-form"><label>邮箱<input name="email" type="email" autocomplete="username" required></label><label>密码<input name="password" type="password" autocomplete="current-password" required></label><button disabled id="login-button">登录</button></form></section><section id="recovery" hidden><h2>设置新密码</h2><p>请账号本人输入新密码。提交后返回登录，不会自动进入任务台。</p><form id="recovery-form"><label>新密码<input name="new-password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required></label><label>确认新密码<input name="confirm-password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required></label><button id="recovery-button" disabled>确认更新密码</button><button type="button" id="recovery-cancel">取消</button></form></section><section id="desk" hidden><div class="toolbar"><h2>我们的任务</h2><button id="refresh">刷新</button><button id="logout">退出</button></div><form id="task-form"><label>想做什么<input name="title" maxlength="120" required></label><label>具体要求<textarea name="details" maxlength="12000" rows="5" required></textarea></label><button>提交任务</button></form><div id="tasks"></div></section><footer>提交成功只代表保存到工作区。自动巡视和自动执行尚未连接。请勿填写密码、密钥或无关隐私。</footer></main><script type="module" src="src/app.mjs"></script></body></html>
